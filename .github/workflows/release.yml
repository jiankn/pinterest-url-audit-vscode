name: Attach VSIX to Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package:vsix -- --out pinterest-url-audit-${{ github.event.release.tag_name }}.vsix
      - name: Attach VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "pinterest-url-audit-${{ github.event.release.tag_name }}.vsix"
