name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package:vsix -- --out pinterest-url-audit.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: pinterest-url-audit-vsix
          path: pinterest-url-audit.vsix
